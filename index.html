<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Research \u2014 Delhivery user journey studies</title>
<meta name="description" content="Research artifacts documenting the Delhivery LM-FE and Hyperlocal rider app journeys: touchpoints, challenges, metrics and opportunities, with annotated screenshot evidence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700;800;900&family=Noto+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>

<div id="progress"></div>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="wordmark"><span class="tick"></span>App Research <small>DELHIVERY &#183; LM-FE APP</small></div>
    <button class="proto-btn" onclick="openPrototype()">View Improved Version</button>
  </div>
  <div class="toc-toggle" id="toc-toggle"></div>
</nav>

<!-- PROTOTYPE OVERLAY -->
<div class="proto-overlay" id="protoOverlay">
  <button class="proto-close" onclick="closePrototype()" aria-label="Close prototype">&#10005;</button>
  <iframe class="proto-frame" id="protoFrame" src="" frameborder="0"></iframe>
</div>

<div class="shell">
  <aside class="rail"><div class="rail-inner" id="rail"></div></aside>
  <main class="main" id="main"></main>
</div>

<footer class="site-footer" id="footer"></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot evidence viewer">
  <button class="lb-close" id="lb-close" aria-label="Close">&#10005;</button>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous screen">&#8249;</button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-nav next" id="lb-next" aria-label="Next screen">&#8250;</button>
</div>

<script src="assets/data.js?v=7"></script>
<script src="assets/app.js?v=11"></script>
<script>
function openPrototype(){
  document.getElementById('protoFrame').src = 'prototype/index.html';
  document.getElementById('protoOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePrototype(){
  document.getElementById('protoOverlay').classList.remove('open');
  document.getElementById('protoFrame').src = '';
  document.body.style.overflow = '';
}
</script>
</body>
</html>
